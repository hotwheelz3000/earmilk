name: Update Earmilk Feed

# Hourly runs moved to a local launchd job (scripts/update_feed.sh) because
# scheduled runs on GitHub-hosted runners kept failing. Manual runs still work.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Earmilk RSS
        run: python fetch.py

      - name: Commit updated posts.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || git commit -m "chore: update feed $(date +'%Y-%m-%d %H:%M %Z')"
          git push
